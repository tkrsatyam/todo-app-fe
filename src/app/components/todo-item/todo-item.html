<div class="todo-item" [class.completed]="todo().completed">
    <input
        type="checkbox"
        class="todo-checkbox"
        [checked]="todo().completed"
        (change)="onToggle()">
    
    <div class="todo-content">
        <span class="todo-title">{{ todo().title }}</span>

        @if (todo().description) {
            <div class="description-wrapper" [class.expanded]="expanded()">
                <span #descriptionRef class="todo-description" [class.todo-description-expanded]="expanded()">
                    {{ todo().description }}
                </span>

                @if (showExpandIcon()) {
                    <button class="expand-btn" (click)="toggleExpanded()">
                        {{ expanded() ? '▴' : '▾' }}
                    </button>
                }
            </div>
        }
    </div>

    <div class="todo-actions">
        <button class="btn-edit" (click)="onEdit()">Edit</button>
        <button class="btn-delete" (click)="onDelete()">Delete</button>
    </div>
</div>

@if (showDeleteModal()) {
    <app-confirm-modal
        message="Are you sure you want to delete '{{ todo().title }}'? This cannot be undone."
        (confirm)="confirmDelete()"
        (cancel)="cancelDelete()">
    </app-confirm-modal>
}
