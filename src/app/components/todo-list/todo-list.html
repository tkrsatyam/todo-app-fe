<div class="todo-container">
    <header class="todo-header">
        <h1>My Todos</h1>
        <button (click)="openNewForm()" [disabled]="loading()">+ New Todo</button>
    </header>

    @if (showForm()) {
        <app-todo-form
            [todo]="editingTodo()"
            (save)="onSave($event)"
            (cancel)="closeForm()">
        </app-todo-form>
    }

    @if (loading()) {
        <div class="loading-state">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
    }

    @if (!loading()) {
        @if (todos().length > 0) {
            <div class="todo-items">
                @for (todo of todos(); track todo.id) {
                    <app-todo-item
                        [todo]="todo"
                        (toggle)="onToggle($event)"
                        (edit)="onEdit($event)"
                        (delete)="onDelete($event)">
                    </app-todo-item>
                }
            </div>
        } @else {
            <div class="empty-state">
                <p>No todos yet. Create one above!</p>
            </div>
        }
    }
</div>

@if (toast()) {
    <app-toast
        [message]="toast()!.message"
        [type]="toast()!.type"
        [duration]="toast()!.duration"
        (dismiss)="dismissToast()">
    </app-toast>
}
